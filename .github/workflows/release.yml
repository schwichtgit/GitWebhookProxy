name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/schwichtgit/gitwebhookproxy
  CHART_DIR: deployments/kubernetes/chart/gitwebhookproxy
  CHART_REPO: oci://ghcr.io/schwichtgit/charts
  # Keyless signing: cosign gets a short-lived Fulcio certificate for the
  # GitHub OIDC identity of this workflow run and records each signature in
  # the Rekor transparency log. Verification pins that identity.
  CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
  CERT_ISSUER: https://token.actions.githubusercontent.com

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing of the checksums file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0

      - name: Add syft to PATH
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >> "$GITHUB_PATH"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.15.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify checksums signature
        run: |
          cosign verify-blob \
            --bundle dist/*_checksums.txt.sigstore.json \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" \
            dist/*_checksums.txt

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/package/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0

      # Sign the index and every platform manifest with a keyless certificate
      # bound to this workflow.
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      # One SPDX SBOM per platform image, attached as a signed in-toto
      # attestation to that platform's manifest digest.
      - name: Generate and attest SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p sbom
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.architecture) \(.digest)"' \
            | while read -r arch digest; do
                "$SYFT" scan "registry:${IMAGE}@${digest}" --output "spdx-json=sbom/gitwebhookproxy-linux-${arch}.spdx.json"
                cosign attest --yes --type spdxjson \
                  --predicate "sbom/gitwebhookproxy-linux-${arch}.spdx.json" "${IMAGE}@${digest}"
                cosign verify-attestation --type spdxjson \
                  --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER" \
                  "${IMAGE}@${digest}" >/dev/null
              done

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-trigger push \
            "${IMAGE}@${DIGEST}" >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: sbom/

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # helm push stores '+' build metadata as '_' in the OCI tag.
      - name: Package and push chart
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm package "$CHART_DIR" --version "$version" --app-version "$version" --destination dist
          helm push "dist/gitwebhookproxy-${version}.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest="$(awk '/^Digest:/ {print $2}' push.log)"
          test -n "$digest"
          cosign sign --yes "${CHART_REPO#oci://}/gitwebhookproxy@${digest}"
          cosign verify \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" \
            "${CHART_REPO#oci://}/gitwebhookproxy@${digest}" >/dev/null
