name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/schwichtgit/gitwebhookproxy
  # mise itself is pinned; all other tools are pinned in mise.toml / mise.lock.
  MISE_VERSION: 2026.11.3

jobs:
  # Pull requests that only touch documentation run the markdown checks and
  # skip the rest. The workflow itself always runs, because its jobs are
  # required checks; a skipped job counts as passed. Pushes to master always
  # run everything.
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.files.outputs.docs-only }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
          printf 'Changed files:\n%s\n' "$files"
          # Documentation: markdown anywhere, docs/, LICENSE, issue templates.
          code="$(grep -vE '\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/' <<<"$files" || true)"
          if [ -z "$code" ]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  qa:
    name: static QA gates
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          # Docs-only changes need just the markdown tools.
          install_args: ${{ needs.changes.outputs.docs-only == 'true' && 'node npm:markdownlint-cli2 npm:prettier' || '' }}
          cache: true

      - name: make docs-lint
        if: needs.changes.outputs.docs-only == 'true'
        run: make docs-lint

      # gofmt, go vet, go mod tidy, golangci-lint, govulncheck, markdownlint,
      # prettier, actionlint, hadolint, helm lint, helm-unittest, kubeconform,
      # Kyverno Pod Security, trivy secret and misconfiguration scans.
      - name: make qa
        if: needs.changes.outputs.docs-only != 'true'
        run: make qa

  test:
    name: tests and coverage
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          cache: true

      - name: Tests with race detector and 85% coverage gate
        run: make cover

  image:
    name: container image
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          install: true
          cache: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same platforms as the release. The builder cross-compiles and the
      # runtime stage has no RUN steps, so no emulation is needed.
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/package/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/package/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha

      # Fails on fixable HIGH/CRITICAL CVEs and on any secret in the image.
      - name: Trivy image scan (CVEs and secrets)
        run: make image-scan IMAGE_TAG=ci
