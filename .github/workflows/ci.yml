name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/schwichtgit/gitwebhookproxy

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go mod tidy
        run: make tidy-check

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build with the go.mod toolchain; prebuilt binaries from an older Go fail to typecheck.
          install-mode: goinstall

      - name: Test with coverage gate
        run: make cover

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  helm:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: deployments/kubernetes/chart/gitwebhookproxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: helm lint and template
        run: make helm-lint

      - name: kubeconform
        run: |
          shopt -s nullglob
          for k8s in 1.30.0 1.33.0; do
            for f in "$CHART_DIR"/ci/*-values.yaml; do
              echo "Kubernetes $k8s, values $f"
              helm template gitwebhookproxy "$CHART_DIR" -f "$f" --kube-version "$k8s" \
                | kubeconform -strict -summary -kubernetes-version "$k8s" -ignore-missing-schemas
            done
          done

      - name: helm-unittest
        run: |
          if compgen -G "$CHART_DIR/tests/*_test.yaml" >/dev/null; then
            helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false
            helm unittest "$CHART_DIR"
          else
            echo "No chart tests found, skipping."
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: build/package/Dockerfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/package/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
