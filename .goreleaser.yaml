# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gitwebhookproxy

before:
  hooks:
    - go mod download

builds:
  - main: .
    binary: gitwebhookproxy
    env:
      - CGO_ENABLED=0
      # CMVP-validated Go Cryptographic Module (certificate #5247); enables FIPS 140-3 mode.
      - GOFIPS140=v1.0.0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# SPDX SBOM per archive, generated with syft.
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

# Keyless cosign signature over the checksums file. The checksums cover the
# archives and the SBOMs, so verifying this one bundle verifies all of them.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: schwichtgit
    name: GitWebhookProxy
