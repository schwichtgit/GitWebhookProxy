suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
release:
  name: gwp
  namespace: default
set:
  config.upstreamURL: http://jenkins.example.svc:8080
tests:
  - it: creates a ServiceAccount without token automount
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: is not rendered when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
