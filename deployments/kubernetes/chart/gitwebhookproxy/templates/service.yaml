apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitwebhookproxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitwebhookproxy.labels" . | nindent 4 }}
  {{- if or .Values.service.annotations .Values.gke.backendConfig.enabled }}
  annotations:
    {{- if .Values.gke.backendConfig.enabled }}
    cloud.google.com/backend-config: {{ printf "{\"default\": \"%s\"}" (include "gitwebhookproxy.backendConfigName" .) | quote }}
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gitwebhookproxy.selectorLabels" . | nindent 4 }}
