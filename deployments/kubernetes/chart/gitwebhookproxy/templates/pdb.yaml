{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gitwebhookproxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitwebhookproxy.labels" . | nindent 4 }}
spec:
  {{- if and (not (kindIs "invalid" .Values.podDisruptionBudget.maxUnavailable)) (ne (toString .Values.podDisruptionBudget.maxUnavailable) "") }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gitwebhookproxy.selectorLabels" . | nindent 6 }}
{{- end }}
