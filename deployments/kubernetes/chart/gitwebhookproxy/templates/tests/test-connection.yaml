apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gitwebhookproxy.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  # Labels intentionally differ from the selector labels so that the Service,
  # PodDisruptionBudget and NetworkPolicy do not select this pod.
  labels:
    helm.sh/chart: {{ include "gitwebhookproxy.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command:
        - wget
      args:
        - -q
        - -O-
        - http://{{ include "gitwebhookproxy.fullname" . }}:{{ .Values.service.port }}/health
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
