{{- include "gitwebhookproxy.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitwebhookproxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitwebhookproxy.labels" . | nindent 4 }}
data:
  GWP_PROVIDER: {{ .Values.config.provider | quote }}
  GWP_UPSTREAMURL: {{ .Values.config.upstreamURL | quote }}
  GWP_ALLOWEDPATHS: {{ .Values.config.allowedPaths | quote }}
  GWP_IGNOREDUSERS: {{ .Values.config.ignoredUsers | quote }}
  GWP_ALLOWEDUSER: {{ .Values.config.allowedUsers | quote }}
  GWP_INSECURESKIPVERIFY: {{ .Values.config.insecureSkipVerify | toString | quote }}
