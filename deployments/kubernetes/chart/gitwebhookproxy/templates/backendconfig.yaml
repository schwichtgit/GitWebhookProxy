{{- if .Values.gke.backendConfig.enabled }}
{{- $hc := .Values.gke.backendConfig.healthCheck }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "gitwebhookproxy.backendConfigName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitwebhookproxy.labels" . | nindent 4 }}
spec:
  {{- if $hc.enabled }}
  healthCheck:
    checkIntervalSec: {{ $hc.checkIntervalSec }}
    timeoutSec: {{ $hc.timeoutSec }}
    healthyThreshold: {{ $hc.healthyThreshold }}
    unhealthyThreshold: {{ $hc.unhealthyThreshold }}
    type: {{ $hc.type }}
    requestPath: {{ $hc.requestPath }}
    port: {{ $hc.port }}
  {{- end }}
  {{- with .Values.gke.backendConfig.extraSpec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
