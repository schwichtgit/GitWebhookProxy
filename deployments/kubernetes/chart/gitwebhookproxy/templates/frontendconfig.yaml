{{- if and .Values.ingress.enabled .Values.gke.frontendConfig.enabled }}
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ include "gitwebhookproxy.frontendConfigName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitwebhookproxy.labels" . | nindent 4 }}
spec:
  {{- with .Values.gke.frontendConfig.sslPolicy }}
  sslPolicy: {{ . }}
  {{- end }}
  {{- if .Values.gke.frontendConfig.redirectToHttps.enabled }}
  redirectToHttps:
    enabled: true
    {{- with .Values.gke.frontendConfig.redirectToHttps.responseCodeName }}
    responseCodeName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
